alpaca:
  paper: true

account:
  starting_capital: 5000.0           # 2026-05-01: bumped from 500 for the
                                     # 1-month paper run before going live.
  max_position_pct: 0.20             # Tighter at the larger size: $1000 max
                                     # per position on $5000 (was 0.25 on $500
                                     # = $125 max). Keeps single-name blast
                                     # radius reasonable.
  max_risk_per_trade_pct: 0.05       # 2% risk = $100 per trade @ $5000
  daily_loss_limit_pct: 0.05         # 5% halt = $250 loss
  max_open_positions: 8
  min_deployable_cash: 50.0          # v2.3.1: skip new entries when settled
                                     # buying power is below this.  Paper
                                     # account is a CASH account (multiplier 1):
                                     # same-day sale proceeds are unsettled
                                     # (T+1) and can't be re-deployed — trying
                                     # to anyway gets rejected by Alpaca.  This
                                     # gate stops the bot spamming orders it
                                     # can't fund.

pdt:
  # Regulatory framework. FINRA retired the PDT rule on 2026-06-04, replacing
  # the 3-day-trades/5-days designation with an intraday-margin model.
  #   legacy           — pre-2026-06-04: enforce the day-trade count limit below.
  #   intraday_margin  — post-2026-06-04: no count limit; defer to Alpaca's
  #                      pre-trade margin checks + buying_power sizing.
  # Flipped 2026-06-05 — FINRA Rule 4210 amendment + Alpaca implementation
  # went live 2026-06-04.  PDT designation retired; Alpaca enforces via
  # pre-trade margin checks + Intraday Margin Deficit (IMD) calls.  The
  # local PDT manager now no-ops and defers entirely to buying_power
  # sizing + Alpaca's checks.
  framework: intraday_margin
  max_day_trades: 3
  day_trade_reserve: 0
  min_conviction_for_day_trade: 0.70
  # V2 Phase 8: SmartPDTPlanner applies a dynamic nudge on top of this
  # floor based on day-of-week (Mon stingy, Fri loose), slots remaining
  # (last slot raises the bar), and recent day-trade win rate.  It also
  # attempts day->swing conversion for swing-compatible strategies when
  # a signal misses the dynamic floor -- intraday setups (orb, vwap)
  # are never converted.
  smart_pdt_enabled: true

scanner:
  min_price: 1.00
  max_price: 50.00
  min_avg_volume: 500000
  min_relative_volume: 1.3            # Reduced from 1.5 — catch more candidates
  min_gap_pct: 1.5                    # Reduced from 2.0 — catch smaller movers
  max_candidates: 25                  # Increased from 20 — more candidates per scan
  options_universe:
    min_price: 10.0
    max_price: 500.0
    min_avg_volume: 1000000
    max_candidates: 30

strategies:
  mean_reversion:
    enabled: true
    rsi_period: 14
    rsi_oversold: 42                # V2: Widened from 38 — catches more dips
    rsi_exit: 55
    atr_stop_multiplier: 1.5
    atr_tp_multiplier: 3.5
    hold_type: swing
    lookback_days: 30

  momentum:
    enabled: true
    volume_spike_multiplier: 1.5    # V2: Restored from 2.0 — catches more breakouts
    breakout_lookback: 20
    atr_stop_multiplier: 1.5
    atr_tp_multiplier: 3.5
    hold_type: adaptive
    min_adr_pct: 1.0                # V2: Reduced from 2.0 — now a conviction factor, not hard gate
    max_gap_pct: 0.15               # Skip if stock gapped >15% overnight (move already done)

  vwap:
    enabled: true
    hold_type: day
    entry_deviation_pct: 0.3        # V2: Reduced from 0.5 — lower dip depth required
    exit_deviation_pct: 0.3

  ema_crossover:
    enabled: true
    fast_period: 9
    slow_period: 20
    trend_period: 50
    rsi_min: 45                     # V2: Widened from 50 — catch earlier entries
    rsi_max: 75                     # V2: Widened from 70 — allow stronger momentum
    atr_stop_multiplier: 1.5
    atr_tp_multiplier: 3.0
    hold_type: swing
    min_entry_price: 5.00           # v2.4.1: skip sub-$5 micro-caps.  LNKS
                                    # 2026-06-17 fired 6 ema_crossover entries
                                    # on a ~$1.85 ticker in 51 minutes for
                                    # -$176. Same micro-cap-on-a-swing pattern
                                    # as RGNT/macd_divergence — the crossover
                                    # signal is real but the float is too thin
                                    # for any stop to protect against an open.

  macd_divergence:
    enabled: true
    lookback_bars: 25               # V2: Increased from 20 — find more divergences
    atr_stop_multiplier: 1.8
    atr_tp_multiplier: 3.5
    hold_type: swing
    min_entry_price: 5.00           # v2.4.0: skip sub-$5 micro-caps.  RGNT
                                    # 2026-06-10 wiped a 6-trade winning streak
                                    # with one overnight gap-down (-$648).
                                    # Swing strategy + sub-$3 micro-cap is the
                                    # wrong mix — too gap-prone for any stop
                                    # to protect.

  bb_squeeze:
    enabled: false                  # 2026-05-05: disabled.  Backtest showed
                                    # 22% WR over 18 trades, -$497 P&L (80% of
                                    # total losses on 4% of trades).  Re-enable
                                    # only after the entry filters are reworked
                                    # — squeeze breakouts are firing on the
                                    # wrong side of the move at this size.
    squeeze_lookback: 5
    min_relative_volume: 1.0        # V2: Reduced from 1.5 — vol is now conviction factor
    atr_tp_multiplier: 3.5
    hold_type: adaptive

  orb:
    enabled: true
    opening_range_minutes: 30
    min_volume_ratio: 1.0           # V2: Reduced from 1.5 — vol is now conviction factor
    min_range_pct: 0.2              # V2: Reduced from 0.3 — catch tighter opens
    hold_type: day

  pullback:
    enabled: true
    pullback_tolerance_pct: 1.5     # V2: Widened from 0.75 — catches more pullbacks
    rsi_min: 35                     # V2: Widened from 40 — deeper pullbacks allowed
    rsi_max: 58                     # V2: Widened from 53 — shallower pullbacks too
    atr_stop_multiplier: 0.5
    atr_tp_multiplier: 3.0
    hold_type: swing

  # ── Options Strategies ──────────────────────────────────
  credit_put_spread:
    enabled: true
    target_delta: 0.25
    min_dte: 20
    max_dte: 45
    max_spread_width: 1.50
    min_credit_pct: 0.25            # V2: Reduced from 0.30 — accept slightly thinner credit
    max_risk: 100.0

  debit_call_spread:
    enabled: true
    long_delta: 0.60
    short_delta: 0.35
    min_dte: 30
    max_dte: 60
    max_debit_pct: 0.50

  long_call:
    enabled: true
    target_delta: 0.60
    min_dte: 20
    max_dte: 60
    max_contract_cost: 75.0
    max_iv_percentile: 1.00

  long_put:
    enabled: true
    target_delta: 0.55
    min_dte: 20
    max_dte: 60
    max_contract_cost: 75.0
    breakdown_lookback: 10

  cash_secured_put:
    enabled: true
    target_delta: 0.20
    min_dte: 20
    max_dte: 45
    min_annualized_return: 0.12     # V2: Reduced from 0.15 ��� accept lower return
    max_stock_price: 5.00           # V2: Increased from 3.00 — more stocks eligible

  momentum_options:
    enabled: true
    min_dte: 5
    max_dte: 20
    min_delta: 0.25
    max_delta: 0.45
    max_contract_cost: 75.0
    min_relative_volume: 1.5        # V2: Reduced from 2.0
    breakout_lookback: 20
    min_roi_pct: 0.25               # V2: Reduced from 0.30

  # V2 Phase 10: 0DTE (same-day expiration) options on liquid underlyings.
  # High-risk/high-reward gamma plays. Position monitor job manages intraday
  # lifecycle (loss cut, trailing, hard time exit at 15:30 ET).
  zero_dte:
    enabled: true
    min_delta: 0.15
    max_delta: 0.40
    max_contract_cost: 50.0         # Max premium per contract ($)
    min_relative_volume: 1.5
    min_roi_pct: 0.50               # Need 50%+ ROI potential (gamma leverage)
    # liquid_underlyings: override list, or use defaults (SPY, QQQ, AAPL, etc.)

  covered_call:
    enabled: true
    target_delta: 0.30
    min_dte: 20
    max_dte: 45
    min_annualized_return: 0.10     # V2: Reduced from 0.12
    max_stock_price: 5.00           # V2: Increased from 3.00

  covered_straddle:
    enabled: false                  # Still disabled — requires too much capital
    min_dte: 20
    max_dte: 45
    max_stock_price: 5.00           # V2: Increased from 3.00
    min_total_credit_pct: 0.05      # V2: Reduced from 0.06
    max_bb_width: 0.08              # V2: Widened from 0.06

sentiment:
  enabled: true
  news_lookback_hours: 36
  news_max_articles: 10
  news_cache_ttl_seconds: 900       # V2 Phase 11: 15-min TTL for news cache (avoid redundant API calls)
  min_conviction_after_mods: 0.40   # V2: Reduced from 0.45 — let more signals through
  block_on_bearish_news: -0.5
  # V2 Phase 11: Earnings proximity guard — block entries when news indicates
  # upcoming or just-released earnings to avoid binary event risk.
  block_near_earnings: true
  earnings_block_days_before: 1
  earnings_block_days_after: 1

options:
  enabled: true
  max_options_positions: 3
  max_options_capital_pct: 0.50
  max_single_options_risk_pct: 0.15  # V2: Increased from 0.12 — allow slightly larger options bets
  # V2 Phase 10: 0DTE risk management (position monitor job parameters)
  zero_dte_loss_cut_pct: -0.50      # Close at -50% of premium
  zero_dte_trail_threshold: 1.00    # Start trailing once +100% profit
  zero_dte_trail_pct: 0.50          # Exit if retraces 50% from peak profit

strategy_weighting:
  enabled: true
  min_weight: 0.3
  max_weight: 2.0
  burn_in_trades: 5                 # V2: Reduced from 10 — start weighting sooner
  recalc_interval_trades: 3         # V2: Reduced from 5 — adapt faster
  recency_halflife_trades: 15       # V2: Reduced from 20 — weight recent trades more

risk:
  stop_loss_pct: 0.03
  trailing_stop_pct: 0.04
  take_profit_pct: 0.06
  position_sizing: fractional
  kelly_fraction: 0.25
  max_portfolio_heat_pct: 0.08      # V2: Increased from 0.06 — allow more concurrent risk
  min_conviction_for_swing: 0.50    # V2: Reduced from 0.55 — let more swing signals through
  symbol_cooldown_minutes: 30       # v2.4.1: after exiting a symbol, ignore
                                    # new signals on it for N minutes. Stops
                                    # the bot compounding losses on a single
                                    # name — LNKS 2026-06-17 fired 6 entries
                                    # on the same ticker in 51 minutes (~-$176)
                                    # because every fresh ema_crossover bar
                                    # re-triggered evaluation. Cooldown is
                                    # in-memory; resets at process restart.
  swing_min_entry_price: 5.00       # v2.4.3: global floor on ANY swing-held
                                    # signal regardless of which strategy
                                    # produced it. A sub-$5 micro-cap carried
                                    # overnight is exposed to gap-down risk no
                                    # stop can protect (RGNT 2026-06-10 macd
                                    # swing, -$648). Composes with per-strategy
                                    # min_entry_price (the higher floor wins).
                                    # Day/adaptive signals are exempt — sub-$2
                                    # momentum/vwap/orb scalps close intraday
                                    # and the P&L data says they work. Note:
                                    # momentum + bb_squeeze emit SWING only at
                                    # conviction < 0.9, so their low-conviction
                                    # overnight variants are caught here while
                                    # their high-conviction day scalps are not.
                                    # 0 disables the gate.

  # V2 Phase 7: dynamic risk tolerance.  The DynamicRiskController composes
  # conviction, streak, regime, and drawdown into runtime sizing multipliers.
  # Defaults are baked into risk/dynamic_risk.py as module constants; this
  # block is here for visibility and future overrides.
  dynamic:
    enabled: true
    high_conviction_min: 0.90       # conviction >= 0.90 unlocks 50% concentration cap
    high_conviction_position_pct: 0.50
    streak_window: 10               # last N closed trades
    streak_win_threshold: 0.60      # > 60% wins -> +0.5x
    streak_loss_threshold: 0.35     # < 35% wins -> -0.5x
    drawdown_tier1_pct: 0.03        # half-size
    drawdown_tier2_pct: 0.05        # halt new entries
    drawdown_tier3_pct: 0.15        # halt + require manual ack

schedule:
  premarket_scan: "09:00"
  market_open: "09:30"
  scan_interval_minutes: 15          # v2.3.0: full-universe scan cadence
                                     # (was 10).  Decoupled from signal
                                     # evaluation — see evaluate_interval_minutes.
  evaluate_interval_minutes: 5       # v2.3.0: per-candidate strategy
                                     # evaluation cadence.  Catches signals
                                     # within 5 min of when they print.
  options_expiry_check: "15:30"
  eod_close_day_trades: "15:50"
  eod_review: "16:05"
  eod_analysis: "16:10"            # V2 Phase 6: loss-pattern + optimizer sweep
  ml_training: "17:00"             # V2 Phase 5: retrain signal-quality classifier

analysis:
  apply_parameter_changes: true   # V2 Phase 6: set true to let optimizer write parameter_overrides
  decision_retention_days: 14     # v2.3.4: prune reject/near_miss decision rows
                                  # older than this in the EOD analysis job.
                                  # ~99% of the decisions table is reject/near_miss
                                  # that nothing automated reads; this caps DB
                                  # growth (~25-34k rows/day) while keeping a
                                  # recent window for ad-hoc debugging. The
                                  # meaningful audit rows (execute/rank/exit) are
                                  # never pruned.
  filter_report_days: 7           # v2.3.5: filter-effectiveness report window.
                                  # Daily EOD job logs the tightest near-miss
                                  # clusters + the signal funnel so a chronically
                                  # tight threshold is visible. Read-only.

monitoring:
  downtime_alert_hours: 2.0       # v2.4.0: email at startup if the last
                                  # heartbeat is older than this. Heartbeat
                                  # is stamped every 60s by job_sync_positions
                                  # so a stale heartbeat == bot was actually
                                  # down (silent crash + clean shutdown both
                                  # caught). The RGNT 2026-06-10 loss happened
                                  # in a 4-day uncovered downtime window.
